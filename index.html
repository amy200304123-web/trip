<style>
  :root {

    --accent-ink: #ffffff;
    --chip: #ffffff;
    --chip-line: #f7bdd0;
    --line: #ffa6c1;
    --paper: #fffaf6;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2b1020; --bg-2: #3d1830; --ink: #ffe6f0; --ink-soft: #eaa6c2;
      --accent: #ff7aa5; --accent-ink: #2b1020; --chip: #3f1b31; --chip-line: #7d3a5c;
      --line: #a8517a; --paper: #3d2330; --paper-line: #6e4258;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2b1020; --bg-2: #3d1830; --ink: #ffe6f0; --ink-soft: #eaa6c2;
    --accent: #ff7aa5; --accent-ink: #2b1020; --chip: #3f1b31; --chip-line: #7d3a5c;
    --line: #a8517a; --paper: #3d2330; --paper-line: #6e4258;

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {

  main { min-height: 100vh; display: grid; place-items: center; padding: 28px 20px 52px; }
  .step { width: 100%; max-width: 470px; animation: fadein .4s ease both; }
  .step[hidden] { display: none; }
  .center { text-align: center; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  h1 { font-size: clamp(1.8rem, 7.5vw, 2.4rem); line-height: 1.35; margin: 0 0 .5rem; font-weight: 700; }

  .sub { color: var(--ink-soft); margin: 0 0 1.4rem; }

  .hero { display: block; font-size: 4.2rem; line-height: 1; margin-bottom: .8rem; }
  @media (prefers-reduced-motion: no-preference) {
    .hero { animation: bob 3.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-9px) rotate(4deg); } }
  }

  button {
    font: inherit; cursor: pointer; border: 2px solid var(--accent); border-radius: 999px;
    padding: .65em 1.6em; min-height: 48px; background: var(--chip); color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .ghost { border-color: var(--chip-line); }

  .answer-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; min-height: 140px; }
  #yes { font-size: var(--yes-size, 1.25rem); padding: .6em 1.4em; }
  #no { transition: left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1); }
  #no.loose { position: fixed; z-index: 10; margin: 0; }
  @media (prefers-reduced-motion: reduce) { #no { transition: none; } }
  .caption { min-height: 1.8em; margin: 1rem 0 0; color: var(--ink-soft); font-size: .95rem; }

  .badge {
    display: inline-block; margin: 0 0 1rem; padding: .25em 1em;
    border: 2px dashed var(--line); border-radius: 999px; color: var(--ink-soft); font-size: .9rem;
  }

  /* big option cards */
  .options { display: grid; gap: 12px; margin: 0 0 1.4rem; padding: 0; border: 0; }
  .options.two { grid-template-columns: 1fr 1fr; }
  .options legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .opt { position: relative; display: block; }
  .opt input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
  .opt span {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15em;
    min-height: 92px; padding: .8em .6em; text-align: center;
    background: var(--chip); border: 2px solid var(--chip-line); border-radius: 20px;
    transition: background .15s, border-color .15s, transform .12s;
  }
  .opt .emo { font-size: 1.9rem; line-height: 1.2; }
  .opt .lbl { font-weight: 700; }
  .opt .note { font-size: .82rem; color: var(--ink-soft); line-height: 1.5; }
  .opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt input:checked + span .note { color: var(--accent-ink); opacity: .9; }
  .opt input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 3px; }

  input[type="date"] {
    font: inherit; color: var(--ink); background: var(--chip);
    border: 2px solid var(--chip-line); border-radius: 16px;
    padding: .6em 1em; min-height: 52px; width: 100%; max-width: 280px;
    margin-bottom: 1rem; color-scheme: light dark;
  }
  .range { min-height: 1.8em; margin: 0 0 1.3rem; color: var(--ink-soft); }

  /* photo slot */
  .photo {
    display: grid; place-items: center; text-align: center;
    height: 120px; margin: 0 0 1.1rem;
    border: 2px dashed var(--line); border-radius: 18px;
    color: var(--ink-soft); font-size: .85rem; line-height: 1.6;
    background: var(--chip);
  }
  .photo .emo { font-size: 2rem; }

  /* timeline */
  .timeline { list-style: none; margin: 0 0 1.2rem; padding: 0 0 0 26px; position: relative; text-align: left; }
  .timeline::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 3px; background: var(--line); border-radius: 2px; }
  .slot { position: relative; padding: 0 0 1.15rem; }
  .slot::before {
    content: ""; position: absolute; left: -26px; top: .5em; width: 17px; height: 17px;
    background: var(--bg-2); border: 3px solid var(--accent); border-radius: 50%;
  }
  .when { font-weight: 700; color: var(--accent); margin: 0; line-height: 1.5; font-size: .95rem; }
  .slot h3 { margin: 0; font-size: 1.12rem; line-height: 1.5; }
  .slot p { margin: .1rem 0 0; color: var(--ink-soft); font-size: .93rem; line-height: 1.6; }

  .picks { display: flex; flex-wrap: wrap; gap: 8px; margin: .55rem 0 0; padding: 0; border: 0; min-width: 0; }
  .picks legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .pick { position: relative; display: block; }
  .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
  .pick span {
    display: block; padding: .3em 1em; min-height: 44px; line-height: 2;
    background: var(--chip); border: 2px solid var(--chip-line); border-radius: 999px; font-size: .92rem;

  }
  .pick input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .pick input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 3px; }
  .hint { font-size: .83rem; color: var(--ink-soft); margin: 0 0 1.1rem; text-align: center; line-height: 1.6; }

  /* final */
  .card {
    background: var(--paper); border: 1px solid var(--paper-line); border-radius: 8px;
    padding: 24px 22px; margin: 0 0 1.1rem; box-shadow: 0 10px 30px rgba(140, 40, 90, .14); text-align: left;

  .card p { margin: 0 0 .8em; line-height: 1.95; }
  .card .from { text-align: right; margin: 1em 0 0; }
  .card mark { background: linear-gradient(transparent 55%, rgba(255, 91, 141, .32) 55%); color: inherit; padding: 0 .1em; }
  .plan { list-style: none; margin: 0; padding: 0; }
  .plan li { padding: .45em 0; border-top: 1px dashed var(--paper-line); line-height: 1.65; font-size: .95rem; }
  .plan li:first-child { border-top: 0; }
  .plan .head { font-weight: 700; color: var(--accent); font-size: 1rem; }
  .plan small { display: block; color: var(--ink-soft); font-weight: 400; }
  .actions { text-align: center; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* music toggle */
  #music {
    position: fixed; right: 14px; z-index: 20;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: 52px; height: 52px; min-height: 52px; padding: 0;
    border-radius: 50%; font-size: 1.3rem; line-height: 1;
    background: var(--chip); border: 2px solid var(--accent);
    box-shadow: 0 4px 14px rgba(140, 40, 90, .2);
  }

  .petal { position: fixed; top: -40px; font-size: 1.6rem; pointer-events: none; z-index: 5; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .petal { display: none; } }
</style>
</head>

    </div>
  </section>

</main>

<button id="music" type="button" aria-pressed="false" aria-label="播放背景音樂">🔈</button>

const $ = (id) => document.getElementById(id);
const steps = ["s0","s1","s2","s3","s4","s5","s6"].map($);
const yes = $("yes"), no = $("no"), caption = $("caption");
const dateInput = $("date"), toPlan = $("toPlan"), rangeEl = $("range");

let LEN = "twoday", DEST = "nantou", DAYS = [];

function show(i) { steps.forEach((s, idx) => { s.hidden = idx !== i; }); window.scrollTo(0, 0); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function pickOf(key) { const el = document.querySelector('input[name="' + key + '"]:checked'); return el ? el.value : ""; }

/* ---- Step 0: runaway button ---- */
let dodges = 0;
function overlaps(a, b, pad) {
  return !(a.right + pad < b.left || a.left - pad > b.right || a.bottom + pad < b.top || a.top - pad > b.bottom);
}
function dodge(e) {
  if (e) e.preventDefault();
  const w = no.offsetWidth, h = no.offsetHeight, m = 16, topSafe = 24;
  const maxX = Math.max(m, window.innerWidth - w - m);
  const maxY = Math.max(topSafe, window.innerHeight - h - m);
  const yr = yes.getBoundingClientRect();
  let x, y, t = 0;
  do {
    x = m + Math.random() * (maxX - m);
    y = topSafe + Math.random() * (maxY - topSafe);
    t++;
  } while (t < 20 && overlaps({ left:x, top:y, right:x+w, bottom:y+h }, yr, 12));
  no.classList.add("loose");
  no.style.left = x + "px";
  no.style.top = y + "px";
  dodges++;
  caption.textContent = CAPTIONS[Math.min(dodges - 1, CAPTIONS.length - 1)];
  yes.style.setProperty("--yes-size", Math.min(1.25 + dodges * 0.22, 2.7) + "rem");
}
no.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") dodge(e); });
no.addEventListener("pointerdown", dodge);
no.addEventListener("click", dodge);
no.addEventListener("focus", dodge);
no.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") dodge(e); });
yes.addEventListener("click", () => show(1));
window.addEventListener("resize", () => {
  if (!no.classList.contains("loose")) return;
  const r = no.getBoundingClientRect();
  if (r.right > window.innerWidth || r.bottom > window.innerHeight) dodge();
});

/* ---- Step 1: trip length ---- */
$("lenOpts").addEventListener("change", () => { $("toDest").disabled = false; });
$("toDest").addEventListener("click", () => {
  LEN = document.querySelector('input[name="len"]:checked').value;
  renderDest();
  show(2);
});

/* ---- Step 2: destination ---- */
function renderDest() {
  let html = "<legend>目的地</legend>";
  Object.keys(TRIPS).forEach((k) => {
    const t = TRIPS[k];
    html += '<label class="opt"><input type="radio" name="dest" value="' + k + '">' +
            '<span><span class="emo" aria-hidden="true">' + t.emo + '</span>' +
            '<span class="lbl">' + esc(t.label) + '</span>' +
            '<span class="note">' + esc(t.note) + '</span></span></label>';
  });
  $("destOpts").innerHTML = html;
  $("toDate").disabled = true;
}
$("destOpts").addEventListener("change", () => { $("toDate").disabled = false; });
$("toDate").addEventListener("click", () => {
  DEST = document.querySelector('input[name="dest"]:checked').value;
  DAYS = TRIPS[DEST][LEN];
  $("dateSub").textContent = LEN === "twoday" ? "選第一天，隔天我們一起回程" : "當天來回，不用請太多假";
  show(3);
});

/* ---- Step 3: date ---- */
function parse(v) { const [y,m,d] = v.split("-").map(Number); return new Date(y, m-1, d); }
function fmt(dt) { return dt.toLocaleDateString("zh-TW", { month:"long", day:"numeric", weekday:"long" }); }
function dayLabels() {
  const d1 = parse(dateInput.value), out = [fmt(d1)];
  for (let i = 1; i < DAYS.length; i++) {
    out.push(fmt(new Date(d1.getFullYear(), d1.getMonth(), d1.getDate() + i)));
  }
  return out;
}
(function setMin() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  dateInput.min = d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
})();
dateInput.addEventListener("input", () => {
  toPlan.disabled = !dateInput.value;
  if (!dateInput.value) { rangeEl.textContent = ""; return; }
  const l = dayLabels();
  rangeEl.textContent = l.length > 1 ? l[0] + " → " + l[l.length-1] : l[0];
});
toPlan.addEventListener("click", () => {
  if (!dateInput.value) return;
  DAYS.forEach((_, i) => renderDay(i));
  show(4);
});

/* ---- Steps 4-5: itinerary ---- */
function renderDay(i) {
  const day = DAYS[i], labels = dayLabels(), host = $("s" + (i + 4));
  const isLast = i === DAYS.length - 1;
  const trip = TRIPS[DEST];
  let html = '<span class="badge">' + esc(labels[i]) + '</span>' +
             '<h2 id="dt' + i + '">' + esc(day.title) + '</h2>' +
             '<p class="sub">' + (DAYS.length > 1 ? '第 ' + (i+1) + ' 天，共 ' + DAYS.length + ' 天' : esc(trip.drive)) + '</p>' +
             '<div class="photo"><div><span class="emo" aria-hidden="true">' + trip.emo + '</span><br>（這裡之後放 ' + esc(trip.label) + ' 的照片）</div></div>' +
             '<ol class="timeline">';
  day.slots.forEach((s) => {
    html += '<li class="slot"><p class="when">' + esc(s.when) + '</p><h3>' + esc(s.name) + '</h3>';
    if (s.note) html += '<p>' + esc(s.note) + '</p>';
    if (s.choices) {
      html += '<fieldset class="picks"><legend>' + esc(s.name) + '</legend>';
      s.choices.forEach((c) => {
        html += '<label class="pick"><input type="radio" name="' + s.key + '" value="' + esc(c) + '"><span>' + esc(c) + '</span></label>';
      });
      html += '</fieldset>';
    }
    html += '</li>';
  });
  html += '</ol>';
  if (DAYS.length > 1) html += '<p class="hint">' + esc(trip.drive) + '</p>';
  html += '<button class="primary" type="button" id="next' + i + '" disabled>' + (isLast ? "送出我的選擇 💌" : "看第二天 →") + '</button>';
  host.innerHTML = html;
  host.setAttribute("aria-labelledby", "dt" + i);

  const btn = $("next" + i);
  const check = () => {
    const need = host.querySelectorAll("fieldset.picks").length;
    const done = host.querySelectorAll("fieldset.picks input:checked").length;
    btn.disabled = done < need;
  };
  host.addEventListener("change", check);
  check();
  btn.addEventListener("click", async () => {
    if (isLast) {
      const sent = await sendTripResult(btn);
      if (sent) { buildFinal(); show(6); petals(); }
    } else show(i + 5);
  });
}

/* ---- Final ---- */
function buildFinal() {
  const labels = dayLabels(), trip = TRIPS[DEST];
  $("finalDate").textContent = labels.length > 1 ? labels[0] + " – " + labels[labels.length-1] : labels[0];

  const highlights = [];
  DAYS.forEach((day) => day.slots.forEach((s) => {
    if (s.key) { const p = pickOf(s.key); if (p) highlights.push(p); }
  }));
  const some = highlights.slice(0, 2).map((h) => '<mark>' + esc(h) + '</mark>').join(" 和 ");

  $("letter").innerHTML =
    '<p><b>' + esc(TO_NAME) + '，</b></p>' +
    '<p>謝謝你答應我。我們要去 <mark>' + esc(trip.label) + '</mark>，' +
      (DAYS.length > 1 ? '玩兩天一夜' : '當天來回') + '。</p>' +
    (some ? '<p>你選了 ' + some + '，我都記下來了。</p>' : '') +
    '<p>' + esc(LETTER_CLOSING) + '</p>' +
    '<p>很期待跟你一起出門。</p>' +
    '<p class="from">— ' + esc(FROM_NAME) + '</p>';

  let plan = '<ul class="plan">';
  DAYS.forEach((day, i) => {
    plan += '<li class="head">' + esc(day.title) + '<small>' + esc(labels[i]) + '</small></li>';
    day.slots.forEach((s) => {
      const p = s.key ? pickOf(s.key) : "";
      plan += '<li>' + esc(s.when) + '　' + esc(s.name) + (p ? '：<b>' + esc(p) + '</b>' : '') + '</li>';
    });
  });
  plan += '</ul>';
  $("planCard").innerHTML = plan;
}

function petals() {
  const emojis = ["🌸","💗","🌷","💕"];
  for (let i = 0; i < 24; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.textContent = emojis[i % emojis.length];
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = 3 + Math.random() * 3 + "s";
    p.style.animationDelay = Math.random() * 1.2 + "s";
    p.setAttribute("aria-hidden", "true");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 8000);
  }
}


/* ---- send trip choices by email ---- */
async function sendTripResult(btn) {
  const labels = dayLabels(), trip = TRIPS[DEST];
  const lines = [];

  lines.push("小姜已完成旅行選擇！");
  lines.push("");
  lines.push("天數：" + (DAYS.length > 1 ? "兩天一夜" : "一日遊"));
  lines.push("地點：" + trip.label);
  lines.push("日期：" + labels.join(" → "));
  lines.push("");

  DAYS.forEach((day, i) => {
    lines.push(day.title + "｜" + labels[i]);
    day.slots.forEach((s) => {
      const p = s.key ? pickOf(s.key) : "";
      lines.push(s.when + "　" + s.name + (p ? "：" + p : ""));
    });
    lines.push("");
  });

  const message = lines.join("\n");

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "送出中… 💌";

  try {
    const response = await fetch("https://formsubmit.co/ajax/amy200304123@gmail.com", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        _subject: "🌸 小姜的旅行選擇",
        name: TO_NAME,
        destination: trip.label,
        days: DAYS.length > 1 ? "兩天一夜" : "一日遊",
        date: labels.join(" → "),
        message: message
      })
    });

    const result = await response.json();

    if (!response.ok || result.success === false) {
      throw new Error("submission failed");
    }

    btn.textContent = "已送出！❤️";
    btn.disabled = true;
    return true;
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = originalText;
    alert("送出失敗，請稍後再試一次。");
    return false;
  }
}

/* ---- reset ---- */
function resetAll(toStep) {
  dodges = 0;
  caption.textContent = "";
  yes.style.removeProperty("--yes-size");
  no.classList.remove("loose");
  no.style.left = ""; no.style.top = "";
  dateInput.value = ""; rangeEl.textContent = ""; toPlan.disabled = true;
  document.querySelectorAll('input[type="radio"]:checked').forEach((r) => { r.checked = false; });
  $("toDest").disabled = true; $("toDate").disabled = true;
  $("s4").innerHTML = ""; $("s5").innerHTML = "";
  show(toStep);
}
$("again").addEventListener("click", () => resetAll(0));
$("restart").addEventListener("click", () => resetAll(1));

/* ---- background music (generated, no file needed) ---- */
(function () {
  const btn = $("music");
  let ctx = null, timer = null, playing = false, step = 0;
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33,
                 523.25, 659.25, 783.99, 880.00, 987.77, 880.00, 783.99, 659.25];

  function ping(freq) {
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.09, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 1.2);
  }
  function start() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      playing = true;
      btn.textContent = "🔊";
      btn.setAttribute("aria-pressed", "true");
      btn.setAttribute("aria-label", "關閉背景音樂");
      ping(NOTES[step++ % NOTES.length]);
      timer = setInterval(() => { ping(NOTES[step++ % NOTES.length]); }, 620);
    } catch (e) { btn.hidden = true; }
  }
  function stop() {
    playing = false;
    clearInterval(timer);
    btn.textContent = "🔈";
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", "播放背景音樂");
  }
  btn.addEventListener("click", () => { playing ? stop() : start(); });
})();
